services:
  estacionamento-vc:
    build: .
    image: trabalho-vc-estacionamento:dev
    container_name: estacionamento-vc
    working_dir: /app
    environment:
      DISPLAY: host.docker.internal:0.0
      QT_X11_NO_MITSHM: "1"
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python main.py
